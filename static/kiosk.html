<!DOCTYPE html>
<html lang="es" class="mirror-root">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>iPad Monitor — Espejo</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="mirror-body mirror-kiosk">
  <div class="mirror-viewport">
    <img id="mirror" class="mirror-img mirror-img-fit" alt="">
  </div>

  <div id="mirror-status" class="mirror-status">Conectando…</div>
  <div id="fit-badge" class="kiosk-fit-badge">Ver todo</div>

  <div id="kiosk-exit" class="kiosk-exit hidden">
    <a href="/start">← Inicio</a>
    <a href="/setup">⚙ Config</a>
  </div>

  <div id="kiosk-tap-zone" class="kiosk-tap-zone" aria-hidden="true"></div>
  <div id="kiosk-fit-zone" class="kiosk-fit-zone" aria-hidden="true"></div>

  <a href="/keyboard" id="kiosk-keyboard" class="kiosk-keyboard" title="Teclado">⌨</a>

  <script src="/static/app.js"></script>
  <script src="/static/mirror-core.js"></script>
  <script>
    MiniPadMirror.init({ kiosk: true, badgeId: "fit-badge" });

    var tapZone = document.getElementById("kiosk-tap-zone");
    var exitPanel = document.getElementById("kiosk-exit");
    var tapCount = 0;
    var tapTimer = null;
    var hideTimer = null;

    function showExit() {
      exitPanel.className = "kiosk-exit";
      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(function () {
        exitPanel.className = "kiosk-exit hidden";
      }, 8000);
    }

    tapZone.onclick = function () {
      tapCount += 1;
      if (tapTimer) clearTimeout(tapTimer);
      tapTimer = setTimeout(function () {
        tapCount = 0;
      }, 900);
      if (tapCount >= 3) {
        tapCount = 0;
        showExit();
      }
    };
  </script>
</body>
</html>
