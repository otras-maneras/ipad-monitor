# iPad Monitor: driver intel de Xorg con una salida VIRTUAL1 para usar el iPad
# como pantalla extendida. Se instala en /etc/X11/xorg.conf.d/.
# Para deshacerlo: sudo rm /etc/X11/xorg.conf.d/20-intel-virtual.conf y
# cerrar sesión (o reiniciar).
Section "OutputClass"
    Identifier "minipad-intel-virtual"
    MatchDriver "i915"
    Driver "intel"
    Option "VirtualHeads" "1"
    # DRI3 deja que las apps usen iris (aceleración OpenGL). Con DRI2 el
    # driver pide i965, que Mesa ya no trae, y todo cae a render por software.
    Option "DRI" "3"
EndSection
